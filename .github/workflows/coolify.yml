name: coolify

# The shared deploy for apps on the VPS, run by Coolify (coolify.calypsogrammar.com). Same contract as
# cloudways-laravel.yml and the Pages workflows (README.md): production only by hand, only green commits on main,
# rollback by an earlier `ref` or to the `stable` tag (then production is held), a `release` deployment record for every
# real run, and a rollback across migrations refused unless `force_migrations` is ticked.
#
# Coolify builds the app itself. This workflow pins the commit (the application's git_commit_sha), starts a deployment
# through Coolify's API and waits for it, then checks the live site. The API sits behind Cloudflare Access, so the
# caller passes an Access service token as well as a Coolify API token.

on:
  workflow_call:
    inputs:
      target:
        description: 'production (the only target)'
        type: string
        default: production
      ref:
        description: 'Commit, tag or branch to deploy; empty = the commit that triggered the caller (or `stable` with rollback)'
        type: string
        default: ''
      dry_run:
        description: 'Check the commit, the migrations and the connection to Coolify; deploy nothing'
        type: boolean
        default: true
      rollback:
        description: 'A deliberate rollback: allowed while production is held, deploys `stable` when ref is empty, and holds production afterwards'
        type: boolean
        default: false
      force_migrations:
        description: 'Roll back even though migrations differ between the live commit and the target (code only: migrations are not undone)'
        type: boolean
        default: false
      required_checks:
        description: 'Check runs that must have passed on the commit, one name per line'
        type: string
        required: true
      app_uuid:
        description: "The Coolify application's UUID (in its dashboard URL)"
        type: string
        required: true
      coolify_url:
        type: string
        default: https://coolify.calypsogrammar.com
      site_url:
        description: 'The live address, for the deployment record and the check afterwards'
        type: string
        required: true
      health_path:
        description: 'A path on site_url that answers 200 when the app is up'
        type: string
        default: /up
      migrations_path:
        type: string
        default: database/migrations
      deploy_timeout_minutes:
        type: number
        default: 20
    secrets:
      COOLIFY_TOKEN:
        description: 'A Coolify API token with deploy and write permission'
        required: true
      CF_ACCESS_CLIENT_ID:
        description: 'Cloudflare Access service token ID, allowed by the Coolify Access application'
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true

permissions:
  contents: read

jobs:
  # Which commit is being published, and whether it may be.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref != '' && inputs.ref || (inputs.rollback && 'stable' || github.sha) }}
          TARGET: ${{ inputs.target }}
          ROLLBACK: ${{ inputs.rollback }}
          EVENT: ${{ github.event_name }}
          REQUIRED_CHECKS: ${{ inputs.required_checks }}
        run: |
          [ "$TARGET" = production ] || { echo "::error title=Unknown target::Coolify apps are deployed to production only, not '$TARGET'."; exit 1; }
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "::error title=Production is manual::Only a run started by hand publishes (this run came from '$EVENT')."
            exit 1
          fi

          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" -q .sha 2> /dev/null)" || sha=""
          [ -n "$sha" ] || { echo "::error title=Unknown commit::'$REF' is not a commit, tag or branch in this repository."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Publishing ${sha::7} ($REF)"

          hold="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/deploy-hold" -q .object.sha 2> /dev/null)" || hold=""
          if [ -n "$hold" ] && [ "$ROLLBACK" != true ]; then
            echo "::error title=Production is held::Production was rolled back to ${hold::7} and is held. Once main is fixed, clear the hold (Actions → stable → Run workflow → clear-hold), then deploy."
            exit 1
          fi

          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" -q .status)"
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error title=Not on main::${sha::7} is not part of main. Merge it first; the deploy only takes commits from main."
            exit 1
          fi
          checked=()
          while IFS= read -r check; do
            check="$(echo "$check" | xargs)"
            [ -n "$check" ] || continue
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" -q "[.check_runs[] | select(.name == \"$check\")] | sort_by(.completed_at) | last | (.status + \" \" + (.conclusion // \"\"))")" || state=""
            if [ "$state" != "completed success" ]; then
              echo "::error title=Checks not green::'$check' on ${sha::7} is '${state:-missing}'. Deploy only a commit whose checks all passed."
              exit 1
            fi
            checked+=("$check")
          done <<< "$REQUIRED_CHECKS"
          [ ${#checked[@]} -gt 0 ] || { echo "::error title=No required checks::The caller named no required checks."; exit 1; }
          echo "Checks green on ${sha::7}: $(IFS=,; echo "${checked[*]}")"

  # The commit Coolify should run, and whether going there would leave newer migrations applied.
  guard:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - name: Check migrations before going back
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          FORCE: ${{ inputs.force_migrations }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIGRATIONS: ${{ inputs.migrations_path }}
        run: |
          live="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&task=release&per_page=1" -q '.[0].sha // "none"')"
          echo "previous=$live" >> "$GITHUB_OUTPUT"
          if [ "$live" = none ] || [ "$live" = "$RELEASE_SHA" ]; then
            echo "No live commit to compare with (or it is this one)."
            exit 0
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$live" -q .status 2> /dev/null)" || status=""
          if [ "$status" != ahead ]; then
            echo "${RELEASE_SHA::7} is not older than the live ${live::7} (${status:-unknown}): not a rollback."
            exit 0
          fi
          changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$live" --paginate -q ".files[].filename | select(startswith(\"$MIGRATIONS/\"))")"
          if [ -z "$changed" ]; then
            echo "Rolling back from ${live::7} to ${RELEASE_SHA::7}: no migrations differ."
            exit 0
          fi
          list="$(echo "$changed" | tr '\n' ' ')"
          if [ "$FORCE" = true ]; then
            echo "::warning title=Rolling back across migrations::These migrations are newer than ${RELEASE_SHA::7} and stay applied: $list"
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning title=Rollback would be refused::These migrations are newer than ${RELEASE_SHA::7}: $list. A real run needs force_migrations."
          else
            echo "::error title=Migrations differ::These migrations are newer than ${RELEASE_SHA::7} and would stay applied: $list. Roll forward with a fix, or run again with force_migrations if the old code works with the newer schema."
            exit 1
          fi

      - name: Check Coolify can be reached
        env:
          COOLIFY_URL: ${{ inputs.coolify_url }}
          APP_UUID: ${{ inputs.app_uuid }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          code="$(curl -s -o app.json -w '%{http_code}' -m 30 "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET")" || code=000
          case "$code" in
            200) echo "Coolify answers for $(jq -r .name app.json) (branch $(jq -r .git_branch app.json))." ;;
            302|403) echo "::error title=Blocked by Cloudflare Access::Coolify's API answered $code. Check the CF_ACCESS_CLIENT_ID/SECRET secrets and that the Coolify Access application has a Service Auth policy for that token."; exit 1 ;;
            401) echo "::error title=Coolify refused the token::Check the COOLIFY_TOKEN secret and that Coolify's API is enabled (Settings → Advanced)."; exit 1 ;;
            *) echo "::error title=Coolify unreachable::$COOLIFY_URL answered $code."; exit 1 ;;
          esac

  deploy:
    needs: [release, guard]
    if: '!inputs.dry_run'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write     # the deploy-hold tag after a rollback
      deployments: write  # the `release` deployment record
    concurrency:
      group: coolify-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ inputs.site_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      PREVIOUS: ${{ needs.guard.outputs.previous }}
      ROLLBACK: ${{ inputs.rollback }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COOLIFY_URL: ${{ inputs.coolify_url }}
      APP_UUID: ${{ inputs.app_uuid }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Record the deployment
        run: |
          id="$(jq -n --arg ref "$RELEASE_SHA" --arg previous "${PREVIOUS:-none}" --argjson rollback "$ROLLBACK" \
            '{ref: $ref, environment: "production", task: "release", auto_merge: false, required_contexts: [], production_environment: true, payload: {previous: $previous, rollback: $rollback}, description: (if $rollback then "rollback" else "release" end)}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - -q .id)"
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress -f log_url="$RUN_URL" > /dev/null

      - name: Pin the commit and deploy
        env:
          TIMEOUT_MINUTES: ${{ inputs.deploy_timeout_minutes }}
        run: |
          api() { curl -sS -m 60 -H "Authorization: Bearer $COOLIFY_TOKEN" -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" -H 'Content-Type: application/json' "$@"; }
          api -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID" -d "$(jq -n --arg sha "$RELEASE_SHA" '{git_commit_sha: $sha}')" > patch.json
          jq -e '.uuid' patch.json > /dev/null || { echo "::error title=Could not pin the commit::$(jq -c . patch.json)"; exit 1; }
          api -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false" > deploy.json
          dep="$(jq -r '.deployments[0].deployment_uuid // empty' deploy.json)"
          [ -n "$dep" ] || { echo "::error title=Coolify did not start a deployment::$(jq -c . deploy.json)"; exit 1; }
          echo "Coolify deployment $dep for ${RELEASE_SHA::7}: $COOLIFY_URL (Deployments)"
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          while :; do
            status="$(api "$COOLIFY_URL/api/v1/deployments/$dep" | jq -r '.status // "unknown"')"
            case "$status" in
              finished) echo "Coolify finished the deployment."; break ;;
              failed|cancelled-by-user|skipped) echo "::error title=Deployment $status::See the deployment log in Coolify ($dep). The previous container keeps running."; exit 1 ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error title=Deployment timed out::Still '$status' after $TIMEOUT_MINUTES minutes ($dep)."; exit 1; }
            sleep 15
          done

      - name: Check the live site
        env:
          SITE_URL: ${{ inputs.site_url }}
          HEALTH_PATH: ${{ inputs.health_path }}
        run: |
          for attempt in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$SITE_URL$HEALTH_PATH")" || code=000
            [ "$code" = 200 ] && { echo "$SITE_URL$HEALTH_PATH answers 200"; exit 0; }
            sleep 10
          done
          echo "::error title=Site not answering::$SITE_URL$HEALTH_PATH answered $code after the deploy."
          exit 1

      - name: Hold production after a rollback
        if: success() && env.ROLLBACK == 'true'
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/deploy-hold" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deploy-hold" -f sha="$RELEASE_SHA" -F force=true > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/deploy-hold -f sha="$RELEASE_SHA" > /dev/null
          fi
          echo "::notice title=Production held::Rolled back to ${RELEASE_SHA::7}. Deploys refuse until the hold is cleared."

      - name: Finish the deployment record
        if: always() && env.DEPLOYMENT_ID != ''
        env:
          OUTCOME: ${{ job.status == 'success' && 'success' || 'failure' }}
          SITE_URL: ${{ inputs.site_url }}
        run: gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" -f state="$OUTCOME" -f log_url="$RUN_URL" -f environment_url="$SITE_URL" > /dev/null
